# Not installed by this repo. Add these locations to the live rende.fun server.
# rendeyuwei/rende-deploy server/examples/nginx/site-root.conf is still only
# `location /`. Do not change receive-deploy.sh.
#
# Hashed shell files are not stored in a release. The build copies them into
# the real directory named by RF_SHELL_SHARED before the receiver switches
# /opt/site/current. Provision that directory once, outside this repo:
#
#   sudo mkdir -p /opt/site/shared/shell
#   sudo chown rende-deploy:rende-deploy /opt/site/shared /opt/site/shared/shell
#   sudo chmod 755 /opt/site/shared /opt/site/shared/shell
#
# The directory must not be a symlink. The deploy user creates files as 644.
# Nginx only needs to read them. Do not delete this directory when pruning
# releases or rolling current back.
#
# Set the site build command to:
#
#   export RF_SHELL_SHARED=/opt/site/shared/shell && npm ci && npm run build
#
# A failed build does not switch current. A missing hash is 404 no-store.
# Do not request a hash on the public edge until this origin returns 200.

location = /shell/topbar.js {
    root /opt/site/current/dist;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location = /shell/lang.js {
    root /opt/site/current/dist;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location = /shell/topbar.css {
    root /opt/site/current/dist;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location = /shell/manifest.json {
    root /opt/site/current/dist;
    add_header Cache-Control "no-cache" always;
    default_type application/json;
    try_files $uri =404;
}

location ~* "^/shell/(lang|topbar)\.[0-9a-f]{64}\.(js|css)$" {
    root /opt/site/shared;
    try_files $uri @shell_miss;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location @shell_miss {
    internal;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
    return 404;
}

location = / {
    root /opt/site/current/dist;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}

location = /en/ {
    root /opt/site/current/dist;
    add_header Cache-Control "no-cache" always;
    try_files /en/index.html =404;
}

location = /index.html {
    root /opt/site/current/dist;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}

location = /en/index.html {
    root /opt/site/current/dist;
    add_header Cache-Control "no-cache" always;
    try_files /en/index.html =404;
}
