# Not installed by this repo. Add these locations to the live rende.fun
# server. rendeyuwei/rende-deploy server/examples/nginx/site-root.conf is
# still only `location /` with `root /opt/site/current/dist`. `root` set
# inside that location is not inherited, so each location repeats it.
# `add_header` in a location replaces headers from the server block; if the
# live server adds other headers, repeat them here.
#
# Nginx serves only /opt/site/current. receive-deploy.sh switches that
# symlink to a new release directory and later deletes old releases (keep).
# A hashed URL stays available because the new dist contains every file in
# public/shell whose name is topbar|lang + sha256. Do not delete those pins.
# Do not mark the unversioned names immutable: a browser that stored the
# October response will not drop it when the header changes.

location = /shell/topbar.js {
    root /opt/site/current/dist;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location = /shell/lang.js {
    root /opt/site/current/dist;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location = /shell/topbar.css {
    root /opt/site/current/dist;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

location = /shell/manifest.json {
    root /opt/site/current/dist;
    add_header Cache-Control "no-cache" always;
    default_type application/json;
    try_files $uri =404;
}

location ~* ^/shell/(lang|topbar)\.[0-9a-f]{64}\.(js|css)$ {
    root /opt/site/current/dist;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location = / {
    root /opt/site/current/dist;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}

location = /en/ {
    root /opt/site/current/dist;
    add_header Cache-Control "no-cache" always;
    try_files /en/index.html =404;
}

location = /index.html {
    root /opt/site/current/dist;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}

location = /en/index.html {
    root /opt/site/current/dist;
    add_header Cache-Control "no-cache" always;
    try_files /en/index.html =404;
}
