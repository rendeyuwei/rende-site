name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Production deploys queue. Do not cancel one that is already running.
concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    # rendeyuwei/rende-deploy deploy-project.yml@main (bdc2cd3).
    # setup_command runs after setup-node and before the default
    # `npm ci --no-audit --no-fund`. test_command stays the default `npm test`.
    # Secrets stay in this repo: ECS_HOST, ECS_USER, ECS_SSH_KEY, ECS_KNOWN_HOSTS.
    uses: rendeyuwei/rende-deploy/.github/workflows/deploy-project.yml@main
    with:
      project: site
      setup_command: bash scripts/install-test-tools.sh
    secrets: inherit
